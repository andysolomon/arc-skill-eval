name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  package-entrypoints:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: every exported file ships and loads, from the registry tarball and a git install
        run: npm run check:packages

  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: test core
        run: npm test

      - name: typecheck web
        run: npm --prefix web run typecheck

      - name: build web
        run: npm --prefix web run build

      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: smoke test web
        run: npm --prefix web run test:e2e
